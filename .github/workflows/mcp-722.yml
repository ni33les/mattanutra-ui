name: MCP conversational v9 scoped checks
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  affected:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nobody
          POSTGRES_PASSWORD: isolated-ci
          POSTGRES_DB: mattanutra_lock_review_ax_ci
        ports: ["55439:5432"]
        options: >-
          --health-cmd "pg_isready -U nobody"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DB_URL: postgres://nobody:isolated-ci@127.0.0.1:55439/mattanutra_lock_review_ax_ci
      MATTANUTRA_ENV: dev
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: node scripts/prepare-matcher-test-db.mjs
      - run: npm run test:mcp:simple-plan -- --output "$RUNNER_TEMP/mcp-simple-plan-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-simple-plan-scoped-evidence
          path: ${{ runner.temp }}/mcp-simple-plan-evidence
          if-no-files-found: error
