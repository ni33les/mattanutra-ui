name: MCP 11 maintained protocol and paired acceptance
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  affected:
    runs-on: ubuntu-latest
    # Two complete maintained passes plus bootstrap/build; individual deadlines stay unchanged.
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nobody
          POSTGRES_PASSWORD: isolated-ci
          POSTGRES_DB: mattanutra_lock_review_ax_ci
        ports: ["55439:5432"]
        options: >-
          --health-cmd "pg_isready -U nobody"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DB_URL: postgres://nobody:isolated-ci@127.0.0.1:55439/mattanutra_lock_review_ax_ci
      MATTANUTRA_ENV: dev
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: node scripts/prepare-matcher-test-db.mjs
      - run: npm run typecheck
      - run: npm run build -- --webpack
        env:
          NODE_ENV: production
          NEXT_BUILD_SKIP_TYPECHECK: "1"
          NEXT_BUILD_CPUS: "2"
      - run: npm run test:matcher:twice
        env:
          MATCHER_TEST_EVIDENCE_DIR: ${{ runner.temp }}/mcp-maintained-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-maintained-evidence
          path: ${{ runner.temp }}/mcp-maintained-evidence
          if-no-files-found: error
